name: Engineering contracts
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/bootstrap.py
      - run: python scripts/verify.py
      - run: python scripts/check_migrations.py
      - run: python research/framework-v0.2.1/validate_research_example.py --as-of 2026-11-18
      - run: python scripts/verify_research.py
      - run: python -m pytest -q
      - run: python scripts/export_contract.py --check
      - run: python scripts/evaluate.py --db outputs/venture_evidence.sqlite --output outputs/development-evaluation.json
      - run: python scripts/import_research.py --db outputs/venture_evidence.sqlite --as-of 2026-11-18 --apply --report outputs/research-import.json
      - run: python scripts/import_discovery.py --db outputs/venture_evidence.sqlite --apply --report outputs/discovery-import.json
      - run: python scripts/evaluation_workbench.py freeze --db outputs/venture_evidence.sqlite --output-dir outputs/frozen-evaluation --as-of 2026-11-18
      - run: python scripts/evaluation_workbench.py review-materials --bundle outputs/frozen-evaluation --output-dir outputs/human-review
      - run: python scripts/evaluation_workbench.py run --bundle outputs/frozen-evaluation --output outputs/frozen-development-run.json
      - run: python scripts/evaluation_workbench.py run --bundle outputs/frozen-evaluation --split held_out --output outputs/held-out-status.json
      - run: python scripts/academic_demo.py
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/bootstrap.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --reporter=list,html
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            frontend/playwright-report
            outputs/browser-tests
          retention-days: 14
