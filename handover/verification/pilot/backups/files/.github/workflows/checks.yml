name: Engineering contracts
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/bootstrap.py
      - run: python scripts/verify.py
      - run: python scripts/check_migrations.py
      - run: python -m pytest -q
      - run: python scripts/export_contract.py --check
      - run: python scripts/evaluate.py --db outputs/venture_evidence.sqlite --output outputs/development-evaluation.json
      - run: python scripts/academic_demo.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/bootstrap.py
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
